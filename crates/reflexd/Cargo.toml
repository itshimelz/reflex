[package]
name = "reflexd"
version = "1.1.0"
edition = "2021"
authors = ["itshimelz"]
description = "Resident engine daemon for Reflex"

[dependencies]
reflex-core = { path = "../reflex-core" }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "macros", "net", "time", "signal", "io-util", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zbus = { version = "4", default-features = false, features = ["tokio"] }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"
