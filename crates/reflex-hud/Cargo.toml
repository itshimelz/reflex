[package]
name = "reflex-hud"
version = "1.1.0"
edition = "2021"
authors = ["itshimelz"]
description = "Pure Rust Wayland Layer-Shell HUD pill for Reflex"

[dependencies]
reflex-core = { path = "../reflex-core" }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
calloop = "0.14"
wayland-client = "0.31"
tiny-skia = "0.12"
resvg = "0.49"
fontdue = "0.9"
tokio = { version = "1.40", features = ["rt", "time", "sync", "macros", "net", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
